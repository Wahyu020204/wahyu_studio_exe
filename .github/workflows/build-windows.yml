name: Build Wahyu Studio Portable EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build portable EXE
        run: npm run dist:portable

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: Wahyu-Studio-Portable-Windows
          path: dist/*.exe
