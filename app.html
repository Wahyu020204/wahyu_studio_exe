<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wahyu Studio</title>
<style>*{box-sizing:border-box}body{margin:0;font:14px 'Segoe UI',Arial;background:#edf1f5;color:#1d2c3b}.bar{height:58px;background:#172b4d;color:white;display:flex;align-items:center;padding:0 18px;gap:10px;box-shadow:0 2px 8px #0002}.brand{font-weight:700;font-size:17px;margin-right:auto}.bar button{border:1px solid #ffffff55;background:#ffffff16;color:#fff;border-radius:7px;padding:9px 16px;font-weight:600;cursor:pointer}.bar button.active{background:white;color:#172b4d}iframe{border:0;width:100%;height:calc(100vh - 58px);display:none;background:white}iframe.active{display:block}</style></head><body>
<div class="bar"><div class="brand">WAHYU STUDIO</div><button id="pbtn" class="active" onclick="showApp('proposal')">PROPOSAL MEBEL</button><button id="ibtn" onclick="showApp('invoice')">INVOICE + OCR</button></div>
<iframe id="proposal" class="active" src="assets/proposal/index.html"></iframe><iframe id="invoice" src="assets/invoice/index.html"></iframe>
<script>function showApp(which){for(const id of ['proposal','invoice']){document.getElementById(id).classList.toggle('active',id===which);document.getElementById(id[0]+'btn').classList.toggle('active',id===which);}}</script></body></html>
